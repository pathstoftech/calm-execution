name: Android CI

on:
  push:
  pull_request:

jobs:
  compile:
    name: Unit tests and assembly checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit and build checks
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
